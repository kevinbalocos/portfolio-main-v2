  <g id="jeydev" fill="currentColor"
     font-family="Inter, Arial, Helvetica, sans-serif"
     font-size="150"
     font-weight="800"
     letter-spacing="-8">
    <text id="J" x="55"  y="158">J</text>
    <text id="E" x="170" y="158">E</text>
    <text id="Y" x="275" y="158">Y</text>
    <text id="D" x="410" y="158">D</text>
    <text id="E2" x="525" y="158">E</text>
    <text id="V" x="630" y="158">V</text>
  </g>

